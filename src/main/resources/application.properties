# Quarkus Application Configuration
quarkus.application.name=camel-jms-master-sink
# Qpid JMS Configuration for AMQPS with mTLS
quarkus.qpid-jms.url=amqps://${BROKER_HOST}:${BROKER_PORT}?transport.trustStoreType=PEMCA&transport.trustStoreLocation=/app/tls/ca/ca.pem&transport.keyStoreType=PEMCFG&transport.keyStoreLocation=/app/tls/pem/tls.pemcfg
# Username from certificate CN (Common Name)
quarkus.qpid-jms.username=${CLIENT_USERNAME}
# Enable connection pooling to prevent connection-per-message churn
quarkus.qpid-jms.wrap=true
# Keep a maximum of 10 connections open and reuse them
quarkus.pooled-jms.max-connections=10
# --- CAMEL CONNECTION CACHING FIX ---
# Force Camel's underlying Spring listener to cache consumers and sessions
camel.component.jms.cache-level-name=CACHE_CONSUMER

# --- DYNAMIC CONSUMER QUEUE CONFIGURATION ---
# Read from CONSUMER_QUEUE env variable
consumer.queue=${CONSUMER_QUEUE}

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.category."com.arkmq".level=DEBUG
quarkus.log.category."org.apache.camel".level=INFO

# Camel Configuration
camel.context.name=camel-jms-master-sink-context

# Health and Metrics
quarkus.health.extensions.enabled=true
quarkus.micrometer.enabled=true